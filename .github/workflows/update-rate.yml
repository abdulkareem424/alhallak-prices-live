name: Update exchange rate

on:
  schedule:
    - cron: "1,31 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose SP Today payload
        run: |
          python - <<'PY'
          import re, urllib.request
          urls = ["https://sp-today.com/currency/us-dollar", "https://sp-today.com/"]
          output = []
          for url in urls:
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8","ignore")
              output += [f"URL={url}", f"LENGTH={len(html)}"]
              for token in ["دمشق","قديمة","للبيع","مبيع","sell","buy","USD","currency"]:
                  hits=[m.start() for m in re.finditer(token,html,re.I)][:5]
                  output.append(f"TOKEN {token}: {hits}")
                  for pos in hits[:2]:
                      snippet=re.sub(r"\\s+"," ",html[max(0,pos-250):pos+500])
                      output.append(snippet)
              api_urls=sorted(set(re.findall(r'https?[^"\\' <>]{10,200}',html)))
              output.append("CANDIDATE_URLS")
              output.extend([u for u in api_urls if any(k in u.lower() for k in ["api","currency","rate"])][:50])
          open("rate-debug.txt","w",encoding="utf-8").write("\n".join(output)[:50000])
          PY
      - name: Save diagnostics
        run: |
          git config user.name "price-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rate-debug.txt
          git diff --cached --quiet || git commit -m "Diagnose exchange rate source"
          git push
