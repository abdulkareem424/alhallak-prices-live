name: Update exchange rate

on:
  schedule:
    - cron: "1,31 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exchange-rate-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Damascus highest sell rate
        run: |
          python - <<'PY'
          import datetime, json, re, urllib.request
          url = "https://sp-today.com/currency/us-dollar"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; AlhallakPriceBoard/1.0)"})
          html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")
          patterns = [
              r"دمشق[\s\S]{0,3000}?للبيع[^0-9]{0,100}([0-9]{1,3}(?:,[0-9]{3})+)",
              r"دمشق[\s\S]{0,3000}?مبيع[^0-9]{0,100}([0-9]{1,3}(?:,[0-9]{3})+)",
              r"دمشق[\s\S]{0,3000}?بيع[\s\S]{0,500}?([0-9]{1,3}(?:,[0-9]{3})+)[^\n]{0,80}قديمة",
          ]
          rate = None
          for pattern in patterns:
              match = re.search(pattern, html, re.I)
              if match:
                  candidate = int(match.group(1).replace(",", ""))
                  if 1000 <= candidate <= 100000:
                      rate = candidate
                      break
          if rate is None:
              raise RuntimeError("Damascus sell rate was not found; manual fallback remains unchanged")
          data = {"rate": rate, "source": "sp-today Damascus highest sell", "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          with open("rate.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False)
              file.write("\n")
          print(f"Saved exchange rate: {rate}")
          PY
      - name: Commit rate check
        run: |
          git config user.name "price-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rate.json
          git diff --cached --quiet || git commit -m "Update exchange rate"
          git push
