name: Update exchange rate
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Damascus high rate
        run: |
          python - <<'PY'
          import json,re,urllib.request,datetime
          try:
              req=urllib.request.Request('https://sp-today.com/currency/us-dollar',headers={'User-Agent':'Mozilla/5.0 PriceBoard/1.0'})
              html=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              m=re.search(r'بيع[\s\S]{0,1200}?([\d]{1,3}(?:,[\d]{3})+)\s*(?:قديمة|ل\.س)',html)
              if not m: raise ValueError('rate not found')
              rate=int(m.group(1).replace(',',''))
              if not 1000 <= rate <= 100000: raise ValueError('invalid rate')
              data={'rate':rate,'source':'sp-today Damascus high sell','updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              open('rate.json','w').write(json.dumps(data,ensure_ascii=False))
          except Exception as e:
              print('Service unavailable; keeping manual fallback:',e)
          PY
      - name: Save updated rate
        run: |
          git config user.name "price-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rate.json
          git diff --cached --quiet || (git commit -m "Update exchange rate" && git push)
