<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الأسعار</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:#201a12;font-family:Tahoma,Arial}.head{background:#173f2b;color:white;padding:20px}.wrap{max-width:1000px;margin:auto;padding:0 16px}.intro{background:white;border:1px solid #d7c9ad;border-radius:20px;padding:18px;margin:22px 0}.intro a{color:#173f2b}.grid{display:grid;gap:10px;padding-bottom:40px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;background:white;border:1px solid #ddd1b9;border-radius:16px;padding:12px}.row input,.row select{width:100%;border:1px solid #d7c9ad;border-radius:10px;padding:10px;font:inherit}.row button{border:0;border-radius:10px;padding:10px 14px;background:#173f2b;color:white;font-weight:bold}.back{color:white}.note{font-size:12px;color:#756b5d}@media(max-width:650px){.row{grid-template-columns:1fr 1fr}.row .name{grid-column:1/-1}.row button{grid-column:1/-1}}</style></head><body><header class="head"><div class="wrap"><a class="back" href="index.html">← صفحة الأسعار</a><h1>إدارة الأسعار</h1></div></header><main class="wrap"><section class="intro"><b>الدخول محمي بحساب GitHub الخاص بك</b><p>عدّل الصنف ثم اضغط حفظ. ستفتح صفحة تأكيد في GitHub؛ بعد الضغط على Submit يتغير السعر تلقائياً خلال دقيقة تقريباً.</p><p class="note">لن تُقبل أي تعديلات إلا إذا أرسلها الحساب المالك abdulkareem424.</p></section><div id="grid" class="grid">جاري تحميل الأصناف...</div></main><script>let products=[];const grid=document.querySelector('#grid');function draw(){grid.innerHTML=products.map((p,i)=>`<article class="row"><input class="name" value="${p[0]}" readonly><input type="number" step="0.1" value="${p[1]}" onchange="products[${i}][1]=Number(this.value)"><select onchange="products[${i}][2]=this.value"><option value="USD" ${p[2]==='USD'?'selected':''}>دولار</option><option value="SYP" ${p[2]==='SYP'?'selected':''}>ليرة سورية</option></select><input value="${p[3]}" readonly><button onclick="save(${i})">حفظ</button></article>`).join('')}function save(i){const body=encodeURIComponent(JSON.stringify({original_name:products[i][0],original_unit:products[i][3],product:products[i]})),title=encodeURIComponent('تعديل سعر: '+products[i][0]);location.href=`https://github.com/abdulkareem424/alhallak-prices-live/issues/new?title=${title}&body=${body}`}fetch('products.json?'+Date.now()).then(r=>r.json()).then(d=>{products=d;draw()}).catch(()=>grid.textContent='تعذر تحميل الأصناف');</script></body></html>
